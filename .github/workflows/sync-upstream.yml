name: Sync upstream

# Daily merge of unrstuart/tacops master into this fork's master - a merge, never a rebase or
# force-push, so the fork's own commits survive. Any merge conflict or failing build/test stops the
# run before anything is pushed (GitHub emails the failure); resolve it by hand and push as usual.
# Pushing to master triggers the Cloudflare auto-deploy, so pending D1 migrations are applied just
# before the push - they're additive, so the currently deployed code keeps working with them.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # The default GITHUB_TOKEN may not push a merge that touches .github/workflows (upstream
          # has workflows of its own) - SYNC_TOKEN, a PAT with the "workflow" scope, covers that.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/unrstuart/tacops.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            git log --oneline HEAD..upstream/master
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: merge upstream
        if: steps.fetch.outputs.behind == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff upstream/master -m "Merge upstream unrstuart/tacops master into fork"

      - name: setup node
        if: steps.fetch.outputs.behind == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install dependencies
        if: steps.fetch.outputs.behind == 'true'
        run: npm ci

      - name: build
        if: steps.fetch.outputs.behind == 'true'
        run: npm run build

      - name: test
        if: steps.fetch.outputs.behind == 'true'
        run: npm test

      - name: apply D1 migrations
        if: steps.fetch.outputs.behind == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply tacops-analytics --remote

      - name: push
        if: steps.fetch.outputs.behind == 'true'
        run: git push origin HEAD:master
