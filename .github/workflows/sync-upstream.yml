name: Sync upstream

# Daily merge of unrstuart/tacops master into this fork's master. The fork only *adds* files (fork/,
# this workflow) and never edits upstream's, so the merge can't conflict - this fork's customizations
# are applied at build time by fork/build.mjs instead. Before pushing, the merged result is patched,
# built and tested exactly as Cloudflare will build it, so a patch that no longer applies (or a broken
# upstream build) fails here and never reaches the deployment. Pushing to master triggers the
# Cloudflare build, whose deploy command applies pending D1 migrations before `wrangler deploy`.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # The default GITHUB_TOKEN may not push a merge that touches .github/workflows (upstream
          # has workflows of its own) - SYNC_TOKEN, a PAT with the "workflow" scope, covers that.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: fetch upstream
        id: fetch
        run: |
          git remote add upstream https://github.com/unrstuart/tacops.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            git log --oneline HEAD..upstream/master
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: merge upstream
        if: steps.fetch.outputs.behind == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff upstream/master -m "Merge upstream unrstuart/tacops master into fork"

      - name: setup node
        if: steps.fetch.outputs.behind == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install dependencies
        if: steps.fetch.outputs.behind == 'true'
        run: npm ci

      - name: patch and build (as Cloudflare will)
        if: steps.fetch.outputs.behind == 'true'
        run: node fork/build.mjs

      - name: test
        if: steps.fetch.outputs.behind == 'true'
        run: npm test

      - name: push
        if: steps.fetch.outputs.behind == 'true'
        run: |
          # The patches above only touched the working tree - push the untouched merge commit.
          git checkout -- .
          git push origin HEAD:master
